<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>跳转中…</title>
  <link rel="canonical" href="./briefing/" />
</head>
<body>
  <p>正在跳转到 <a id="link" href="./briefing/">每日简报</a>…</p>
  <script>
    (function () {
      var target = './briefing/' + (location.hash || '');
      document.getElementById('link').href = target;
      location.replace(target);
    })();
  </script>
</body>
</html>
